# Note: additional setup is required, see https://www.jenkins.io/redirect/continuous-delivery-of-plugins
name: cd
on:
  workflow_dispatch:
    inputs:
      validate_only:
        required: false
        type: boolean
        description: |
          Run validation with release drafter only
          → Skip the release job
        default: false
  check_run:
    types:
      - completed

permissions:
  checks: read

jobs:
  automated-release:
    uses: jenkins-infra/jenkins-release-automation/.github/workflows/cd.yaml@main
    secrets: inherit
    permissions:
      contents: write
      checks: read
